[manifest]
id = "snap64_island_skies"
version = "1.1.0"
display_name = "Island Skies"
description = """
The island's sky at any hour and in any weather: night, sunset, dawn, a \
dusk that falls during the ride, or live by your own clock, under weather \
of the island's own. Stars, the moon and its glint on the water, shooting \
stars, the Volcano's embers; rain, storms, snow and ash. Photos keep the \
sky of their instant. Simple is three rows; Live is one; Custom gives each \
course its own hour and weather.

Source: https://github.com/JackandBeans/Snap64RecompMods"""
# One line in the Mods page's help box, which holds about 45 characters.
short_description = "The island at any hour, in any weather."
authors = [ "JackandBeans" ]
game_id = "pokemonsnap"
minimum_recomp_version = "1.1.3"
dependencies = [ ]
optional_dependencies = [ ]
native_libraries = [ ]

[inputs]
# Paths are read relative to this file.
elf_path = "../../build/island_skies/mod.elf"
mod_filename = "snap64_island_skies"
func_reference_syms_file = "../../Snap64RecompSyms/pokemonsnap.us.syms.toml"
data_reference_syms_files = [ "../../Snap64RecompSyms/pokemonsnap.us.datasyms.toml" ]
# The picture the Mods page shows on the mod's details page (thumb.png at
# the .nrm's root, as the runtime reads it).
additional_files = [ "thumb.png" ]

# The page has two faces. Simple shows three rows; Custom shows every course's
# own rows and the fine switches (hidden_from, which the port's Mods page honors).

[[manifest.config_options]]
id = "setup"
name = "Setup"
description = "Simple: one hour and weather. Live: your clock, the island's weather. Custom: every row."
type = "Enum"
options = [ "Simple", "Live", "Custom" ]
default = "Simple"

[[manifest.config_options]]
id = "time"
name = "Time"
description = "The island's hour, or the one your clock says. It takes effect at the next ride."
type = "Enum"
options = [ "Night", "Sunset", "Dawn", "Dusk", "Day", "Your clock" ]
default = "Night"
hidden_from = { id = "setup", matches = [ "Live", "Custom" ] }

[[manifest.config_options]]
id = "weather"
name = "Weather"
description = "Island's own: rain on the River, clear elsewhere. Any other falls on every course."
type = "Enum"
options = [ "Island's own", "Clear", "Rain", "Storm", "Snow", "Random" ]
default = "Island's own"
hidden_from = { id = "setup", matches = [ "Live", "Custom" ] }

[[manifest.config_options]]
id = "sun"
name = "Sun"
description = "Fixed hours, or the sun's own hours today from the Latitude and Longitude rows."
type = "Enum"
options = [ "Fixed hours", "By latitude" ]
default = "Fixed hours"
hidden_from = { id = "setup", matches = [ "Simple" ] }

[[manifest.config_options]]
id = "latitude"
name = "Latitude"
description = "Degrees north of the equator, minus for south: the sun's hours and the seasons."
type = "Number"
min = -60
max = 60
step = 1
precision = 0
default = 40
hidden_from = { id = "setup", matches = [ "Simple" ] }

[[manifest.config_options]]
id = "longitude"
name = "Longitude"
description = "Degrees east, minus for west: noon where your clock has it. 0 takes your clock's zone."
type = "Number"
min = -180
max = 180
step = 1
precision = 0
default = 0
hidden_from = { id = "setup", matches = [ "Simple" ] }

[[manifest.config_options]]
id = "beach"
name = "Beach"
description = "The Beach's hour: night, sunset, dawn, dusk, day as the cartridge has it, or your clock's."
