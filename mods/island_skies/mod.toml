[manifest]
id = "snap64_island_skies"
version = "0.5.0"
display_name = "Island Skies"
description = """
The island's sky at any hour and in any weather. The Beach, the Tunnel, the \
River, the Volcano and the Valley after dark, at sunset, at dawn, through a dusk that \
falls during the ride, or at the hour your own clock says. Each course's \
sky, ground, water and light are the course's own, turned as the course is \
loaded: stars that twinkle between the clouds, a moon over the open sky with \
its glint on the water, a shooting star now and then, the Volcano lit by its \
own lava with embers rising off it, and insects chirping in the dark. Rain, \
storms with lightning and thunder, snow that lies on the Valley, ash over \
the Volcano. Photos keep the sky of their instant. Simple set-up is three \
rows; Custom gives each course its own hour and weather.

Source: https://github.com/JackandBeans/Snap64RecompMods"""
# One line in the Mods page's help box, which holds about 45 characters.
short_description = "The island at any hour, in any weather."
authors = [ "JackandBeans" ]
game_id = "pokemonsnap"
minimum_recomp_version = "1.1.3"
dependencies = [ ]
optional_dependencies = [ ]
native_libraries = [ ]

[inputs]
# Paths are read relative to this file.
elf_path = "../../build/island_skies/mod.elf"
mod_filename = "snap64_island_skies"
func_reference_syms_file = "../../Snap64RecompSyms/pokemonsnap.us.syms.toml"
data_reference_syms_files = [ "../../Snap64RecompSyms/pokemonsnap.us.datasyms.toml" ]
# The picture the Mods page shows on the mod's details page (thumb.png at
# the .nrm's root, as the runtime reads it).
additional_files = [ "thumb.png" ]

# The page has two faces. Simple shows three rows; Custom shows every course's
# own rows and the fine switches (hidden_from, which the port's Mods page honors).

[[manifest.config_options]]
id = "setup"
name = "Setup"
description = "Simple: one hour and weather. Live: your clock, weather by chance. Custom: every row."
type = "Enum"
options = [ "Simple", "Live", "Custom" ]
default = "Simple"

[[manifest.config_options]]
id = "time"
name = "Time"
description = "The island's hour, or the one your computer's clock says, round the whole day."
type = "Enum"
options = [ "Night", "Sunset", "Dawn", "Dusk", "Day", "Your clock" ]
default = "Night"
hidden_from = { id = "setup", matches = [ "Live", "Custom" ] }

[[manifest.config_options]]
id = "weather"
name = "Weather"
description = "Island's own: rain on the River, clear elsewhere. Random draws each ride's weather."
type = "Enum"
options = [ "Island's own", "Clear", "Rain", "Storm", "Snow", "Random" ]
default = "Island's own"
hidden_from = { id = "setup", matches = [ "Live", "Custom" ] }

[[manifest.config_options]]
id = "beach"
name = "Beach"
